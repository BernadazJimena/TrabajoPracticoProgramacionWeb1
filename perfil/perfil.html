<!DOCTYPE html>
<!-- Perfil: muestra y modifica la cuenta activa, su foto, preferencias y logros. -->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - LingoWeb</title>
    <link rel="stylesheet" href="../css/base/base.css">
    <link rel="stylesheet" href="../css/layout/navbar.css">
    <link rel="stylesheet" href="../css/pages/perfil.css">
    <link rel="stylesheet" href="../css/componentes/dinamico.css">
</head>

<body>
    <nav class="navbar"></nav>

    <main class="page-wrapper contenedor">
        <div class="grilla-perfil">

            <aside class="sidebar-perfil"></aside>

            <section class="ajustes-perfil">
                <h2 style="margin-bottom: var(--spacing-lg);">Ajustes de cuenta</h2>

                <section class="tarjeta tarjeta-ajustes">
                    <h3>Información personal</h3>
                    <div class="grupo-form mt-md">
                        <label for="language" class="etiqueta-form">Idioma de la interfaz:</label>
                        <select id="language" class="select-form">
                            <option value="es">Español</option>
                            <option value="en" lang="en">English</option>
                            <option value="pt" lang="pt">Português</option>
                        </select>
                    </div>
                </section>

                <section class="tarjeta tarjeta-ajustes">
                    <h3>Cambiar contraseña</h3>
                    <form action="#" method="POST">
                        <div class="grupo-form">
                            <label for="current_password" class="etiqueta-form">Contraseña actual:</label>
                            <input type="password" id="current_password" class="input-form" placeholder="••••••••">
                        </div>
                        <div class="grupo-form">
                            <label for="new_password" class="etiqueta-form">Nueva contraseña:</label>
                            <input type="password" id="new_password" class="input-form" placeholder="••••••••">
                        </div>
                        <div class="grupo-form">
                            <label for="confirm_password" class="etiqueta-form">Confirmar nueva contraseña:</label>
                            <input type="password" id="confirm_password" class="input-form" placeholder="••••••••">
                        </div>
                    </form>
                </section>

                <div class="flex gap-md" style="justify-content: flex-end;">
                    <a href="../index.html" class="btn btn-contorno"
                        style="width: auto; border-color: var(--danger-color); color: var(--danger-color); box-shadow: 0 0.25rem 0 var(--danger-color);">Cerrar sesión</a>
                    <button type="button" class="btn btn-primario" style="width: auto;">Guardar cambios</button>
                </div>

            </section>
        </div>
    </main>
    <script src="../js/datos/temas.js"></script>
    <script src="../js/datos/datos.js"></script>
    <script src="../js/nucleo/base_de_datos.js"></script>
    <script src="../js/nucleo/progreso.js"></script>
    <script src="../js/nucleo/interfaz.js"></script>
    <script src="../js/nucleo/traduccion.js"></script>
    <script src="../js/nucleo/navegacion.js"></script>
    <script src="../js/vistas/cuenta/perfil.js"></script>
</body>

</html>
