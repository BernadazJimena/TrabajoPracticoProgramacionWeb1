<!DOCTYPE html>
<!-- Registro: crea una cuenta nueva en localStorage. -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - LingoWeb</title>
    <link rel="stylesheet" href="../css/base/base.css">
    <link rel="stylesheet" href="../css/layout/footer.css">
    <link rel="stylesheet" href="../css/pages/registro.css">
    <link rel="stylesheet" href="../css/componentes/dinamico.css">
</head>
<body>
    <main class="auth-wrapper fondo-registro">
        <section class="tarjeta tarjeta-auth registro">
            <h1 class="logo-auth secundario">LingoWeb</h1>
            <p class="subtitulo-auth">Crea tu perfil y comienza a aprender hoy mismo</p>
            
            <form id="formulario-registro" action="../login/login.html" method="GET">
                <div class="grupo-form texto-izquierda" style="text-align: left;">
                    <label for="fullname" class="etiqueta-form">Nombre completo:</label>
                    <input type="text" id="fullname" class="input-form" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="grupo-form texto-izquierda" style="text-align: left;">
                    <label for="email" class="etiqueta-form">Correo electrónico:</label>
                    <input type="email" id="email" class="input-form" placeholder="tu@correo.com" required>
                </div>
                
                <div class="grupo-form texto-izquierda" style="text-align: left;">
                    <label for="password" class="etiqueta-form">Contraseña:</label>
                    <input type="password" id="password" class="input-form" placeholder="••••••••" required>
                </div>

                <div class="grupo-form texto-izquierda" style="text-align: left; margin-bottom: var(--spacing-lg);">
                    <label for="confirm_password" class="etiqueta-form">Confirmar contraseña:</label>
                    <input type="password" id="confirm_password" class="input-form" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-secundario">Crear cuenta</button>
            </form>
            
            <footer class="enlaces-auth fila">
                <span>¿Ya tienes una cuenta? <a href="../login/login.html" class="enlace-primario">Inicia sesión</a></span>
            </footer>
        </section>
    </main>
    <script src="../js/datos/temas.js"></script>
    <script src="../js/datos/datos.js"></script>
    <script src="../js/nucleo/base_de_datos.js"></script>
    <script src="../js/nucleo/progreso.js"></script>
    <script src="../js/nucleo/interfaz.js"></script>
    <script src="../js/nucleo/traduccion.js"></script>
    <script src="../js/nucleo/navegacion.js"></script>
    <script src="../js/vistas/acceso/registro.js"></script>
</body>
</html>
